# conf/training/vietnam_corrflow_training.yaml
# CorrFlow diffusion-stage training config.

hp:
    training_duration: 200000000
    # Training duration in number of processed images.

    total_batch_size: 256
    # Total batch size across all GPUs.

    batch_size_per_gpu: 64
    # Batch size per GPU. Must satisfy:
    #   total_batch_size % (batch_size_per_gpu * world_size) == 0

    lr: 0.0002
    # Peak learning rate.

    grad_clip_threshold: null
    # null = let handle_and_clip_gradients use its own default (no hard clip).
    # Set to e.g. 1.0 to enable gradient clipping.

    lr_decay: 1
    # LR exponential decay multiplier per 5M images after ramp-up (1 = no decay).

    lr_rampup: 10000000
    # Linear LR ramp-up duration in images.

perf:
    fp_optimizations: amp-bf16
    # Floating-point mode. amp-bf16 = best throughput on A100/H100.
    # Options: fp32 | fp16 | amp-fp16 | amp-bf16

    dataloader_workers: 12
    # DataLoader worker processes.

    songunet_checkpoint_level: 0
    # Gradient checkpointing inside SongUNet (0 = disabled).
    # NOTE: This field is read but has no effect on FlowUNet in the current
    # notebook implementation. It is kept for config parity with CorrDiff.

io:
    regression_checkpoint_path: /mnt/data/khaiht/outputs/vietnam_regression_hope/checkpoints_regression_best/UNet.0.315136.mdlus
    # Path to the frozen stage-1 regression checkpoint.
    # This must be a valid Modulus checkpoint loadable via Module.from_checkpoint().

    print_progress_freq: 1000
    # Log a progress line every N processed images.

    save_checkpoint_freq: 5000
    # Save a FlowUNet checkpoint every N processed images.

    validation_freq: 5000
    # Run validation every N processed images.

    validation_steps: 100
    # Number of validation batches to average for the validation loss.
