defaults:
  - base

num_ensembles: 32
  # Number of ensembles to generate per input
seed_batch_size: 32
  # Size of the batched inference
inference_mode: all
  # Choose between "all" (regression + diffusion), "regression" or "diffusion"
hr_mean_conditioning: True
gridtype: sinusoidal
N_grid_channels: 4
sample_res: full
  # Sampling resolution
times_range: null
times:

io:
  res_ckpt_filename: /mnt/data/khaiht/outputs/vietnam_diffusion_hope/checkpoints_diffusion_best/EDMPrecondSR.0.10090240.mdlus
    # Checkpoint filename for the diffusion model
    
  reg_ckpt_filename: /mnt/data/khaiht/outputs/vietnam_regression_hope/checkpoints_regression_best/UNet.0.315136.mdlus
    # Checkpoint filename for the mean predictor model
